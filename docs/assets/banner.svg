<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f1c"/>
      <stop offset="55%" stop-color="#0f2f2a"/>
      <stop offset="100%" stop-color="#0a1f1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5c7"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>

  <!-- Icone: headset de suporte -->
  <g transform="translate(90,80)">
    <path d="M10 80 A60 60 0 0 1 130 80" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <rect x="0" y="72" width="24" height="40" rx="10" fill="#0f3a33" stroke="#00e5c7" stroke-width="4"/>
    <rect x="116" y="72" width="24" height="40" rx="10" fill="#0f3a33" stroke="#00e5c7" stroke-width="4"/>
    <path d="M128 108 v14 a14 14 0 0 1 -14 14 h-18" fill="none" stroke="#00a4ef" stroke-width="6" stroke-linecap="round"/>
    <circle cx="96" cy="136" r="7" fill="#00e5c7"/>
  </g>

  <!-- Pontos de conexao decorativos -->
  <circle cx="1060" cy="60" r="5" fill="#00e5c7" opacity="0.8"/>
  <circle cx="1110" cy="95" r="4" fill="#00a4ef" opacity="0.7"/>
  <circle cx="1130" cy="150" r="6" fill="#0078d4" opacity="0.8"/>
  <circle cx="1080" cy="200" r="4" fill="#00e5c7" opacity="0.6"/>
  <circle cx="1150" cy="230" r="5" fill="#00a4ef" opacity="0.7"/>
  <line x1="1060" y1="60" x2="1110" y2="95" stroke="#00a4ef" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1110" y1="95" x2="1130" y2="150" stroke="#00a4ef" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1130" y1="150" x2="1080" y2="200" stroke="#00a4ef" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1080" y1="200" x2="1150" y2="230" stroke="#00a4ef" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Texto principal -->
  <text x="290" y="110" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    Base de Conhecimento
  </text>
  <text x="290" y="158" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    Suporte de TI <tspan fill="#00e5c7">/</tspan> HelpDesk
  </text>

  <!-- Subtitulo -->
  <text x="292" y="195" font-family="Segoe UI, Verdana, sans-serif" font-size="19" fill="#8fd8c9">
    Troubleshooting, procedimentos e fluxos de atendimento documentados
  </text>

  <!-- Tags -->
  <g font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="600">
    <rect x="292" y="220" width="100" height="28" rx="14" fill="#0f3a33" stroke="#00e5c7" stroke-width="1"/>
    <text x="342" y="239" fill="#7fffe0" text-anchor="middle">Hardware</text>

    <rect x="402" y="220" width="82" height="28" rx="14" fill="#0f3a33" stroke="#00e5c7" stroke-width="1"/>
    <text x="443" y="239" fill="#7fffe0" text-anchor="middle">Rede</text>

    <rect x="494" y="220" width="118" height="28" rx="14" fill="#0f3a33" stroke="#00e5c7" stroke-width="1"/>
    <text x="553" y="239" fill="#7fffe0" text-anchor="middle">Segurança</text>

    <rect x="622" y="220" width="128" height="28" rx="14" fill="#0f3a33" stroke="#00e5c7" stroke-width="1"/>
    <text x="686" y="239" fill="#7fffe0" text-anchor="middle">M365</text>
  </g>
</svg>
